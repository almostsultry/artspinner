<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Spinner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Oswald:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --s1: #141414;
      --s2: #1e1e1e;
      --s3: #2a2a2a;
      --s4: #383838;
      --s5: #505050;
      --b1: #3e2800;
      --b2: #7a5a08;
      --b3: #a07818;
      --b4: #b8900c;
      --b5: #cfa020;
      --b6: #e8bc38;
      --b7: #f4d060;
      --text: #ccc4ac;
      --bg: #0a0a0a;
      --item-h: 48px;
    }

    body {
      background: var(--bg);
      background-image: radial-gradient(ellipse 120% 50% at 50% -10%, #1a1a1a 0%, #0a0a0a 60%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 6rem;
      font-family: 'Oswald', sans-serif;
      color: var(--text);
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 2.2rem;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      color: var(--b6);
      text-shadow:
        0 2px 3px rgba(0,0,0,0.95),
        0 -1px 0 rgba(244,208,96,0.15),
        0 0 50px rgba(160,120,24,0.2);
      letter-spacing: 0.08em;
    }
    header p {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--b2);
      margin-top: 0.5rem;
      text-shadow: 0 1px 2px rgba(0,0,0,0.9);
    }

    /* ── Machine ── */
    .machine {
      background:
        repeating-linear-gradient(
          172deg,
          transparent 0px, transparent 2px,
          rgba(255,255,255,0.011) 2px, rgba(255,255,255,0.011) 4px
        ),
        linear-gradient(
          158deg,
          #2e2e2e 0%, #1e1e1e 22%,
          #2b2b2b 42%, #1c1c1c 62%,
          #262626 82%, #202020 100%
        );
      border-radius: 14px;
      padding: 1.6rem 1.5rem 1.4rem;
      position: relative;
      box-shadow:
        0 0 0 1px var(--s1),
        0 0 0 3px var(--b4),
        0 0 0 5px var(--b1),
        0 0 0 7px var(--s1),
        inset 0 1px 0 rgba(255,255,255,0.06),
        inset 0 -1px 0 rgba(0,0,0,0.6),
        0 40px 100px rgba(0,0,0,0.97);
      min-width: min(620px, calc(100vw - 2rem));
    }

    /* Thin brass inlay bar across the top inside */
    .machine::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      border-radius: 14px 14px 0 0;
      background: linear-gradient(90deg,
        var(--b1) 0%, var(--b5) 20%, var(--b6) 50%, var(--b5) 80%, var(--b1) 100%);
      opacity: 0.7;
    }

    /* ── Reels Frame ── */
    .reels-frame {
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0px, transparent 3px,
          rgba(255,255,255,0.006) 3px, rgba(255,255,255,0.006) 4px
        ),
        linear-gradient(180deg, #0c0c0c 0%, #101010 100%);
      border-radius: 8px;
      border: 1px solid var(--s1);
      box-shadow:
        inset 0 5px 24px rgba(0,0,0,0.95),
        inset 0 1px 0 rgba(0,0,0,0.9),
        0 0 0 1px var(--b1);
      display: flex;
      overflow: hidden;
    }

    .reel-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.7rem 0.4rem 0.8rem;
    }
    .reel-col + .reel-col {
      border-left: 1px solid var(--b1);
      box-shadow: inset 1px 0 0 rgba(255,255,255,0.025);
    }

    .reel-label {
      font-size: 0.56rem;
      letter-spacing: 0.22em;
      color: var(--b2);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0,0,0,0.95);
    }

    .reel-window {
      width: 100%;
      height: 240px;
      overflow: hidden;
      position: relative;
      border-radius: 3px;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.85);
    }
    .reel-window::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,0.94) 0%,
        rgba(0,0,0,0.35) 20%,
        transparent 38%,
        transparent 62%,
        rgba(0,0,0,0.35) 80%,
        rgba(0,0,0,0.94) 100%
      );
      z-index: 2;
      pointer-events: none;
    }
    /* Center selection — engraved brass lines */
    .reel-window::after {
      content: '';
      position: absolute;
      left: 6px; right: 6px;
      top: calc(50% - 24px);
      height: 48px;
      border-top: 1px solid rgba(160,120,24,0.45);
      border-bottom: 1px solid rgba(160,120,24,0.45);
      z-index: 3;
      pointer-events: none;
      transition: border-color 0.4s, box-shadow 0.4s;
    }

    .reel-strip {
      position: absolute;
      top: 0; left: 0; right: 0;
    }

    .reel-item {
      height: var(--item-h);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.72rem;
      text-align: center;
      padding: 0 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: rgba(160,120,24,0.18);
      line-height: 1.2;
      transition: color 0.1s;
    }
    .reel-item.adj  { color: rgba(160,120,24,0.45); }
    .reel-item.center {
      color: var(--b6);
      font-size: 0.88rem;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 14px rgba(160,120,24,0.28);
    }

    .reel-col.spinning .reel-window { filter: blur(0.8px); }
    .reel-col.spinning .reel-window::after { display: none; }
    .reel-col.spinning .reel-item { transition: none; }

    .reel-col.locked .reel-window::after {
      border-color: var(--b6);
      box-shadow:
        0 0 14px rgba(232,188,56,0.35),
        inset 0 0 14px rgba(232,188,56,0.06);
      animation: win-glow 0.9s ease-in-out 3;
    }
    .reel-col.locked .reel-item.center {
      color: var(--b7);
      text-shadow: 0 0 18px rgba(244,208,96,0.55), 0 1px 3px rgba(0,0,0,0.9);
    }
    @keyframes win-glow {
      0%, 100% { box-shadow: 0 0 6px rgba(232,188,56,0.18); }
      50%       { box-shadow: 0 0 24px rgba(232,188,56,0.5); }
    }

    /* ── Spin Button ── */
    .spin-btn {
      display: block;
      width: 100%;
      margin-top: 1.2rem;
      padding: 0.9rem 2rem;
      font-family: 'Oswald', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--b6);
      text-shadow:
        0 2px 3px rgba(0,0,0,0.95),
        0 -1px 0 rgba(244,208,96,0.12);
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background:
        repeating-linear-gradient(
          170deg,
          transparent 0px, transparent 2px,
          rgba(255,255,255,0.008) 2px, rgba(255,255,255,0.008) 3px
        ),
        linear-gradient(180deg, #424242 0%, #303030 35%, #252525 70%, #1c1c1c 100%);
      box-shadow:
        0 0 0 1px var(--s1),
        0 0 0 3px var(--b4),
        0 0 0 4px var(--b1),
        0 0 0 6px var(--s1),
        inset 0 1px 0 rgba(255,255,255,0.09),
        inset 0 -1px 0 rgba(0,0,0,0.65),
        0 5px 18px rgba(0,0,0,0.75);
      transition: box-shadow 0.12s, transform 0.08s, color 0.12s;
      position: relative;
    }
    .spin-btn:hover:not(:disabled) {
      color: var(--b7);
      box-shadow:
        0 0 0 1px var(--s1),
        0 0 0 3px var(--b5),
        0 0 0 4px var(--b2),
        0 0 0 6px var(--s1),
        inset 0 1px 0 rgba(255,255,255,0.11),
        inset 0 -1px 0 rgba(0,0,0,0.65),
        0 7px 24px rgba(0,0,0,0.75),
        0 0 40px rgba(160,120,24,0.07);
    }
    .spin-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow:
        0 0 0 1px var(--s1),
        0 0 0 3px var(--b3),
        0 0 0 4px var(--b1),
        0 0 0 6px var(--s1),
        inset 0 3px 8px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(0,0,0,0.5),
        0 2px 8px rgba(0,0,0,0.7);
    }
    .spin-btn:disabled {
      cursor: not-allowed;
      color: var(--b2);
      opacity: 0.5;
    }

    /* ── Machine Footer ── */
    .machine-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.55rem 0.3rem 0;
    }
    .brand {
      font-size: 0.52rem;
      letter-spacing: 0.3em;
      color: var(--b2);
      text-shadow: 0 1px 2px rgba(0,0,0,0.95);
      text-transform: uppercase;
    }
    /* Decorative center mark */
    .brand-mark {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-mark::before,
    .brand-mark::after {
      content: '';
      display: block;
      width: 20px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--b2), transparent);
    }

    /* ── Result Section ── */
    .result-section {
      margin-top: 2.5rem;
      text-align: center;
      max-width: 640px;
      width: 100%;
      padding: 0 1rem;
    }
    .prompt-text {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1rem, 2.8vw, 1.4rem);
      line-height: 1.8;
      color: var(--text);
      min-height: 3.5em;
      transition: opacity 0.4s;
    }
    .prompt-text.dim { opacity: 0.28; }
    .prompt-text .hi {
      color: var(--b6);
      font-style: italic;
      text-shadow: 0 0 22px rgba(160,120,24,0.2);
    }

    .gen-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      margin-top: 1.6rem;
    }

    .generate-btn {
      padding: 0.65rem 2.2rem;
      font-family: 'Oswald', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--b5);
      text-shadow: 0 1px 2px rgba(0,0,0,0.9);
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background: linear-gradient(180deg, #3c3c3c 0%, #282828 55%, #1e1e1e 100%);
      box-shadow:
        0 0 0 1px var(--s1),
        0 0 0 2px var(--b3),
        0 0 0 3px var(--b1),
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 3px 12px rgba(0,0,0,0.65);
      transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s, color 0.15s;
      display: none;
    }
    .generate-btn.visible { display: inline-block; }
    .generate-btn:hover {
      color: var(--b7);
      transform: translateY(-1px);
      box-shadow:
        0 0 0 1px var(--s1),
        0 0 0 2px var(--b4),
        0 0 0 3px var(--b1),
        inset 0 1px 0 rgba(255,255,255,0.10),
        0 5px 16px rgba(0,0,0,0.65);
    }
    .generate-btn:active { transform: translateY(0); }
    .generate-btn:disabled { opacity: 0.38; cursor: not-allowed; transform: none; }

    /* Settings toggle */
    .settings-toggle {
      width: 34px; height: 34px;
      background: transparent;
      border: 1px solid var(--b2);
      border-radius: 50%;
      color: var(--b2);
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, color 0.2s;
      flex-shrink: 0;
    }
    .settings-toggle:hover { border-color: var(--b5); color: var(--b5); }
    .settings-toggle.active { border-color: var(--b5); color: var(--b5); }

    .settings-panel {
      display: none;
      background:
        linear-gradient(160deg, #1e1e1e 0%, #161616 100%);
      border: 1px solid var(--b2);
      border-radius: 8px;
      padding: 1.2rem 1.4rem 1rem;
      margin-top: 1rem;
      text-align: left;
      width: 100%;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 8px 24px rgba(0,0,0,0.5);
    }
    .settings-panel.open { display: block; }
    .settings-row { margin-bottom: 0.9rem; }
    .settings-row:last-child { margin-bottom: 0; }
    .settings-label {
      display: block;
      font-size: 0.58rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--b3);
      margin-bottom: 0.35rem;
      text-shadow: 0 1px 2px rgba(0,0,0,0.9);
    }
    .settings-select, .settings-input {
      width: 100%;
      background: rgba(0,0,0,0.55);
      border: 1px solid var(--b2);
      border-radius: 4px;
      color: var(--text);
      font-family: 'Oswald', sans-serif;
      font-size: 0.82rem;
      padding: 0.45rem 0.7rem;
    }
    .settings-select:focus, .settings-input:focus {
      outline: none; border-color: var(--b5);
    }
    .settings-hint {
      display: block;
      font-size: 0.62rem;
      color: var(--b3);
      opacity: 0.8;
      margin-top: 0.3rem;
      line-height: 1.5;
    }
    .settings-hint a { color: var(--b5); text-decoration: none; }
    .settings-hint a:hover { text-decoration: underline; }

    /* ── Image Section ── */
    .image-section {
      margin-top: 2.5rem;
      width: 100%;
      max-width: 660px;
      padding: 0 1rem;
      display: none;
    }
    .image-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #080808;
      border-radius: 10px;
      border: 1px solid var(--s1);
      overflow: hidden;
      box-shadow:
        0 0 0 1px var(--b2),
        inset 0 0 40px rgba(0,0,0,0.6),
        0 20px 60px rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .image-frame img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .image-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      color: var(--b2);
      text-align: center;
      padding: 2rem;
    }
    .image-placeholder svg { opacity: 0.18; }
    .image-placeholder p {
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.5;
    }
    .loading-sub {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.3;
      margin-top: -0.5rem;
    }
    .fallback-prompt {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 0.85rem;
      color: var(--b6);
      opacity: 0.9;
      text-transform: none;
      letter-spacing: 0;
      max-width: 340px;
      line-height: 1.5;
      margin: 0;
    }
    .fallback-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      margin-top: 0.25rem;
    }
    .open-link {
      display: inline-block;
      padding: 0.45rem 1.1rem;
      border: 1px solid var(--b2);
      border-radius: 4px;
      color: var(--b5);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
      cursor: pointer;
      background: transparent;
      font-family: 'Oswald', sans-serif;
    }
    .open-link:hover { background: var(--b1); color: var(--b7); }
    .loading-ring {
      width: 48px; height: 48px;
      border: 2px solid rgba(160,120,24,0.12);
      border-top-color: var(--b4);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .image-caption {
      margin-top: 0.8rem;
      font-size: 0.7rem;
      letter-spacing: 0.07em;
      color: rgba(160,120,24,0.45);
      text-align: center;
      font-style: italic;
      font-family: 'Playfair Display', serif;
      display: none;
    }
    .image-caption.visible { display: block; }

    /* ── Error toast ── */
    .toast {
      position: fixed;
      bottom: 2rem; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1a0800;
      border: 1px solid #6b2800;
      color: #cc7755;
      padding: 0.6rem 1.4rem;
      border-radius: 6px;
      font-size: 0.76rem;
      letter-spacing: 0.05em;
      transition: transform 0.3s ease;
      z-index: 999;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .machine { min-width: unset; width: 100%; padding: 1.2rem 0.9rem 1.1rem; }
      .reel-window { height: 192px; }
      .reel-window::after { top: calc(50% - 24px); height: 48px; }
      .reel-label { font-size: 0.5rem; }
      .reel-item { font-size: 0.65rem; }
      .reel-item.center { font-size: 0.78rem; }
      .spin-btn { font-size: 0.85rem; letter-spacing: 0.28em; }
    }
  </style>
</head>
<body>

<header>
  <h1>Art Spinner</h1>
  <p>Let fate choose your masterpiece</p>
</header>

<div class="machine" id="machine">
  <div class="reels-frame">
    <div class="reel-col" id="reel-0">
      <div class="reel-label">Visual Medium</div>
      <div class="reel-window"><div class="reel-strip" id="strip-0"></div></div>
    </div>
    <div class="reel-col" id="reel-1">
      <div class="reel-label">Inspired By</div>
      <div class="reel-window"><div class="reel-strip" id="strip-1"></div></div>
    </div>
    <div class="reel-col" id="reel-2">
      <div class="reel-label">In the Style of</div>
      <div class="reel-window"><div class="reel-strip" id="strip-2"></div></div>
    </div>
  </div>

  <button class="spin-btn" id="spin-btn">Spin</button>

  <div class="machine-footer">
    <span class="brand">Art Spinner&trade;</span>
    <span class="brand brand-mark">—</span>
    <span class="brand">Est.&nbsp;2025</span>
  </div>
</div>

<div class="result-section">
  <div class="prompt-text dim" id="prompt-text">
    Press Spin to select your fate&hellip;
  </div>

  <div class="gen-row">
    <button class="generate-btn" id="gen-btn">&#10024; Generate Image</button>
    <button class="settings-toggle" id="settings-toggle" title="Image generation settings">&#9881;</button>
  </div>

  <div class="settings-panel" id="settings-panel">
    <div class="settings-row">
      <label class="settings-label" for="service-select">Image service</label>
      <select class="settings-select" id="service-select">
        <option value="stablehorde">Stable Horde &mdash; free, no key (slow, 576&times;320)</option>
        <option value="huggingface">Hugging Face &mdash; free token, FLUX, 1920&times;1080</option>
        <option value="together">Together AI &mdash; free key, FLUX, 1920&times;1080</option>
      </select>
    </div>
    <div class="settings-row" id="key-row" style="display:none">
      <label class="settings-label" for="api-key-input">API token / key</label>
      <input class="settings-input" type="password" id="api-key-input"
             placeholder="Paste your token here&hellip;" autocomplete="off">
      <span class="settings-hint" id="service-hint"></span>
    </div>
  </div>
</div>

<div class="image-section" id="img-section">
  <div class="image-frame" id="img-frame">
    <div class="image-placeholder">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      <p>Click Generate Image to create your artwork</p>
    </div>
  </div>
  <div class="image-caption" id="img-caption"></div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

/* ──────────────────────────────────────────
   DATA
────────────────────────────────────────── */
const DATA = [
  [
    'Oil Painting','Watercolor','Digital Illustration','Photograph',
    'Charcoal Sketch','Ink Drawing','Mosaic','Stained Glass',
    'Gouache Painting','Linocut Print','Screen Print','Acrylic Painting',
    'Pastel Drawing','Collage','Fresco','Woodblock Print',
    'Spray Paint Mural','Pencil Sketch','Tapestry','Sculpture'
  ],
  [
    'Claude Monet','Vincent van Gogh','Frida Kahlo','Pablo Picasso',
    'Salvador Dalí','Georgia O\'Keeffe','Banksy','Jean-Michel Basquiat',
    'Andy Warhol','Katsushika Hokusai','Gustav Klimt','Rembrandt van Rijn',
    'Leonardo da Vinci','Jackson Pollock','Yayoi Kusama','Edward Hopper',
    'Wassily Kandinsky','Henri Matisse','René Magritte','Alphonse Mucha'
  ],
  [
    'Impressionism','Cubism','Surrealism','Abstract Expressionism',
    'Art Nouveau','Baroque','Pop Art','Minimalism','Romanticism',
    'Pointillism','Fauvism','Dadaism','Constructivism','Expressionism',
    'Post-Impressionism','Futurism','Gothic','Vaporwave','Psychedelic',
    'Street Art'
  ]
];

const SPIN_DURATIONS = [2000, 2700, 3500];
const ITEM_H = 48;
const VISIBLE = 5;
const CENTER  = 2;

/* ──────────────────────────────────────────
   REEL CLASS
────────────────────────────────────────── */
class Reel {
  constructor(colId, items) {
    this.col   = document.getElementById(colId);
    this.strip = document.getElementById(colId.replace('reel', 'strip'));
    this.items = items;
    this.N     = items.length;
    this.idx   = Math.floor(Math.random() * this.N);
    this.spinning = false;
    this.locked   = false;
    this._buildEls();
    this._render();
  }

  _buildEls() {
    this.strip.innerHTML = '';
    this.els = Array.from({ length: VISIBLE }, () => {
      const el = document.createElement('div');
      el.className = 'reel-item';
      this.strip.appendChild(el);
      return el;
    });
  }

  _itemAt(offset) {
    return this.items[((this.idx + offset) % this.N + this.N) % this.N];
  }

  _render() {
    for (let i = 0; i < VISIBLE; i++) {
      const off = i - CENTER;
      this.els[i].textContent = this._itemAt(off);
      this.els[i].className   = 'reel-item' +
        (off === 0 ? ' center' : Math.abs(off) === 1 ? ' adj' : '');
    }
  }

  getValue() { return this.items[this.idx]; }

  spin(duration, targetIdx, onStop) {
    if (this.spinning) return;
    this.spinning = true;
    this.locked   = false;
    this.col.classList.remove('locked');
    this.col.classList.add('spinning');

    const end = Date.now() + duration;
    const fast = () => {
      this.idx = (this.idx + 1) % this.N;
      this._render();
      if (Date.now() < end) {
        setTimeout(fast, 55);
      } else {
        this.col.classList.remove('spinning');
        this._slowDown(targetIdx, onStop);
      }
    };
    fast();
  }

  _slowDown(targetIdx, onStop) {
    let steps = (targetIdx - this.idx + this.N) % this.N;
    if (steps < 4) steps += this.N;

    let step = 0;
    const tick = () => {
      this.idx = (this.idx + 1) % this.N;
      this._render();
      step++;

      if (step >= steps) {
        this.spinning = false;
        this.locked   = true;
        this.col.classList.add('locked');
        onStop && onStop(this.items[this.idx]);
        return;
      }

      const p     = step / steps;
      const delay = 80 + p * p * 570;
      setTimeout(tick, delay);
    };
    tick();
  }
}

/* ──────────────────────────────────────────
   TOAST
────────────────────────────────────────── */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

/* ──────────────────────────────────────────
   MACHINE STATE
────────────────────────────────────────── */
let reels      = [];
let isSpinning = false;
let results    = [null, null, null];
let currentPrompt = '';

function init() {
  reels = DATA.map((items, i) => new Reel(`reel-${i}`, items));
  document.getElementById('spin-btn').addEventListener('click', handleSpin);
  document.getElementById('gen-btn').addEventListener('click', generateImage);
  initSettings();
}

function handleSpin() {
  if (isSpinning) return;
  startSpin();
}

function startSpin() {
  isSpinning = true;
  results    = [null, null, null];

  const promptEl = document.getElementById('prompt-text');
  promptEl.classList.add('dim');
  promptEl.textContent = 'Spinning…';

  document.getElementById('gen-btn').classList.remove('visible');
  document.getElementById('img-section').style.display = 'none';
  document.getElementById('img-caption').classList.remove('visible');

  const btn = document.getElementById('spin-btn');
  btn.disabled = true;

  const targets = DATA.map(d => Math.floor(Math.random() * d.length));
  let stopped = 0;

  reels.forEach((reel, i) => {
    reel.spin(SPIN_DURATIONS[i], targets[i], value => {
      results[i] = value;
      if (++stopped === 3) onAllStopped();
    });
  });
}

function onAllStopped() {
  isSpinning = false;
  document.getElementById('spin-btn').disabled = false;

  const [media, influence, style] = results;
  const promptEl = document.getElementById('prompt-text');
  promptEl.classList.remove('dim');
  promptEl.innerHTML =
    `Create a <span class="hi">${esc(media)}</span> inspired by ` +
    `<span class="hi">${esc(influence)}</span> in the style of ` +
    `<span class="hi">${esc(style)}</span>.`;

  document.getElementById('gen-btn').classList.add('visible');

  const imgSection = document.getElementById('img-section');
  imgSection.style.display = 'block';
  document.getElementById('img-frame').innerHTML = `
    <div class="image-placeholder">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      <p>Click Generate Image to create your artwork</p>
    </div>`;
}

/* ──────────────────────────────────────────
   SETTINGS
────────────────────────────────────────── */
const SK_SVC = 'artspinner-service';
const SK_KEY = 'artspinner-key';

const SERVICE_HINTS = {
  stablehorde: 'No key needed. Community GPU network &mdash; expect 1&ndash;5 min. Output ~576&times;320.',
  huggingface: 'Free token from <a href="https://huggingface.co/settings/tokens" target="_blank" rel="noopener">huggingface.co/settings/tokens</a> &mdash; create a token with <em>Inference</em> access. FLUX.1-schnell at 1920&times;1080.',
  together:    'Free key from <a href="https://api.together.xyz/settings/api-keys" target="_blank" rel="noopener">api.together.xyz</a>. FLUX.1-schnell at 1920&times;1080.',
};

function initSettings() {
  const sel    = document.getElementById('service-select');
  const input  = document.getElementById('api-key-input');
  const toggle = document.getElementById('settings-toggle');
  const panel  = document.getElementById('settings-panel');

  sel.value   = localStorage.getItem(SK_SVC) || 'stablehorde';
  input.value = localStorage.getItem(SK_KEY) || '';
  applyService(sel.value);

  toggle.addEventListener('click', () => {
    const open = panel.classList.toggle('open');
    toggle.classList.toggle('active', open);
  });
  sel.addEventListener('change', () => {
    localStorage.setItem(SK_SVC, sel.value);
    applyService(sel.value);
  });
  input.addEventListener('input', () => localStorage.setItem(SK_KEY, input.value.trim()));
}

function applyService(svc) {
  document.getElementById('key-row').style.display   = svc === 'stablehorde' ? 'none' : '';
  document.getElementById('service-hint').innerHTML  = SERVICE_HINTS[svc] || '';
}

/* ──────────────────────────────────────────
   IMAGE GENERATION
────────────────────────────────────────── */
let genId = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function generateImage() {
  const [media, influence, style] = results;
  if (!media) return;

  const svc    = localStorage.getItem(SK_SVC) || 'stablehorde';
  const apiKey = (localStorage.getItem(SK_KEY) || '').trim();

  if (svc !== 'stablehorde' && !apiKey) {
    document.getElementById('settings-panel').classList.add('open');
    document.getElementById('settings-toggle').classList.add('active');
    showToast('Enter your API token in settings first.');
    return;
  }

  genId++;
  const myId = genId;

  const btn = document.getElementById('gen-btn');
  btn.disabled    = true;
  btn.textContent = 'Generating…';

  const prompt  = `${media}, inspired by ${influence}, ${style} style, highly detailed`;
  currentPrompt = prompt;
  const bingUrl = `https://www.bing.com/images/create?q=${encodeURIComponent(prompt)}`;
  const frame   = document.getElementById('img-frame');

  const setStatus = (main, sub = '') => {
    const m = frame.querySelector('.loading-status');
    const s = frame.querySelector('.loading-sub');
    if (m) m.textContent = main;
    if (s) s.textContent = sub;
  };

  const showFallback = (msg) => {
    if (genId !== myId) return;
    frame.innerHTML = `
      <div class="image-placeholder">
        <p>${msg}</p>
        <p class="fallback-prompt">"${esc(prompt)}"</p>
        <div class="fallback-actions">
          <a class="open-link" href="${bingUrl}" target="_blank" rel="noopener noreferrer">
            Try on Bing (DALL&#8209;E) &#8599;
          </a>
          <button class="open-link" onclick="copyCurrentPrompt()">Copy Prompt</button>
        </div>
      </div>`;
    btn.disabled    = false;
    btn.textContent = '✨ Try Again';
  };

  const displaySuccess = (imgEl) => {
    if (genId !== myId) return;
    frame.innerHTML = '';
    frame.appendChild(imgEl);
    document.getElementById('img-caption').textContent = `"${prompt}"`;
    document.getElementById('img-caption').classList.add('visible');
    btn.disabled    = false;
    btn.textContent = '✨ Generate Again';
  };

  frame.innerHTML = `
    <div class="image-placeholder">
      <div class="loading-ring"></div>
      <p class="loading-status">Generating your artwork…</p>
      <p class="loading-sub"></p>
    </div>`;

  try {
    let imgEl;
    if (svc === 'huggingface') {
      imgEl = await genHuggingFace(prompt, apiKey, myId, setStatus);
    } else if (svc === 'together') {
      imgEl = await genTogether(prompt, apiKey, myId, setStatus);
    } else {
      imgEl = await genStableHorde(prompt, myId, setStatus);
    }
    displaySuccess(imgEl);
  } catch (err) {
    if (genId === myId) showFallback(esc(err.message));
  }
}

/* ── Hugging Face ── */
async function genHuggingFace(prompt, token, myId, setStatus) {
  setStatus('Generating with FLUX…', 'Hugging Face — may take 20–60s on cold start');

  const attempt = async () => {
    const res = await fetch(
      'https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell',
      {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          inputs: prompt,
          parameters: { width: 1920, height: 1080, num_inference_steps: 4 }
        })
      }
    );

    if (res.status === 503) {
      const body    = await res.json().catch(() => ({}));
      const waitSec = Math.ceil(body.estimated_time || 20);
      setStatus('Model loading…', `~${waitSec}s — warming up`);
      await sleep(waitSec * 1000);
      return attempt();
    }

    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || `HTTP ${res.status}`);
    }

    const blob = await res.blob();
    if (!blob.type.startsWith('image/')) throw new Error('Non-image response — check your token');
    return blobToImg(blob);
  };

  return attempt();
}

/* ── Together AI ── */
async function genTogether(prompt, token, myId, setStatus) {
  setStatus('Generating with FLUX…', 'Together AI');

  const res = await fetch('https://api.together.xyz/v1/images/generations', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'black-forest-labs/FLUX.1-schnell-Free',
      prompt,
      width: 1920, height: 1080,
      steps: 4, n: 1,
      response_format: 'b64_json'
    })
  });

  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error?.message || `HTTP ${res.status}`);
  }

  const data = await res.json();
  const b64  = data.data?.[0]?.b64_json;
  if (!b64) throw new Error('No image data in Together AI response');
  return base64ToImg(b64);
}

/* ── Stable Horde (free, anon key) ── */
async function genStableHorde(prompt, myId, setStatus) {
  setStatus('Joining AI queue…', 'Stable Horde community GPUs');

  const res = await fetch('https://stablehorde.net/api/v2/generate/async', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': '0000000000' },
    body: JSON.stringify({
      prompt,
      params: { width: 576, height: 320, steps: 20, n: 1,
                sampler_name: 'k_euler_a', cfg_scale: 7 },
      r2: false
    })
  });

  if (!res.ok) throw new Error(`Stable Horde queue error: HTTP ${res.status}`);
  const { id } = await res.json();
  if (!id) throw new Error('No job ID from Stable Horde');

  for (let i = 0; i < 72; i++) {
    if (genId !== myId) return;
    await sleep(5000);

    const check = await fetch(`https://stablehorde.net/api/v2/generate/check/${id}`)
      .then(r => r.json());
    if (check.faulted) throw new Error('Job faulted on Stable Horde');

    if (check.done) {
      const status = await fetch(`https://stablehorde.net/api/v2/generate/status/${id}`)
        .then(r => r.json());
      const b64 = status.generations?.[0]?.img;
      if (!b64) throw new Error('No image in Stable Horde response');
      return base64ToImg(b64);
    }

    const parts = [];
    if (check.queue_position > 0) parts.push(`queue: ${check.queue_position}`);
    if (check.wait_time > 0)      parts.push(`~${check.wait_time}s`);
    setStatus('Generating…', parts.join(' · ') || 'working…');
  }

  throw new Error('Stable Horde timed out after 6 minutes');
}

function blobToImg(blob) {
  const url = URL.createObjectURL(blob);
  const img = document.createElement('img');
  img.onload = () => URL.revokeObjectURL(url);
  img.src = url;
  return img;
}

function base64ToImg(b64) {
  let mime = 'image/png';
  if (b64.startsWith('/9j/'))   mime = 'image/jpeg';
  if (b64.startsWith('UklGR')) mime = 'image/webp';
  const img = document.createElement('img');
  img.src = `data:${mime};base64,${b64}`;
  return img;
}

function copyCurrentPrompt() {
  navigator.clipboard.writeText(currentPrompt).then(() => {
    showToast('Prompt copied to clipboard!');
  }).catch(() => {
    showToast('Copy failed — select the prompt text manually.');
  });
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

init();
</script>
